[project]
name = "hackathon-pw-backend"
version = "0.1.0"
description = "Algorand ASA / NFT backend"
requires-python = ">=3.10,<3.12"

dependencies = [
    "pyteal==0.24.1",
    "beaker-pyteal==1.1.1",
    "algokit-utils==2.3.0",
    "setuptools<81",
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic[email]>=2.5.0,<3.0.0",
    "py-algorand-sdk>=2.6.1,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0"
]

[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"
